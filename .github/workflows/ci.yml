name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  ci:
    runs-on: ubuntu-latest
    env:
      # Reads the private @run-iq packages (org secret: classic PAT, read:packages).
      NODE_AUTH_TOKEN: ${{ secrets.RUN_IQ_PACKAGES_TOKEN || secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://npm.pkg.github.com
          scope: '@run-iq'
          cache: npm
      # Pull requests into refonte/*: core is checked against the spec of refonte/phase-2, not
      # against the published @run-iq/spec (the registry has no version matching core's range).
      # Spec is built, left out of core's install (on the runner's copy of package.json and
      # package-lock.json only), then linked in place. The install is per package: a workspace
      # crashes npm 10 on this tree.
      - name: Check out spec (refonte/phase-2)
        if: startsWith(github.base_ref, 'refonte/')
        uses: actions/checkout@v4
        with:
          repository: Run-IQ/spec
          ref: refonte/phase-2
          path: spec-refonte
      - name: Build spec
        if: startsWith(github.base_ref, 'refonte/')
        run: |
          npm ci --prefix spec-refonte
          npm run build --prefix spec-refonte
      - name: Drop the published spec from the install
        if: startsWith(github.base_ref, 'refonte/')
        run: |
          node -e "
          const fs = require('fs');
          const manifest = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          delete manifest.dependencies['@run-iq/spec'];
          fs.writeFileSync('package.json', JSON.stringify(manifest, null, 2) + '\\n');
          const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
          delete lock.packages[''].dependencies['@run-iq/spec'];
          delete lock.packages['node_modules/@run-iq/spec'];
          fs.writeFileSync('package-lock.json', JSON.stringify(lock, null, 2) + '\\n');
          "
      - run: npm ci
      - name: Link the built spec
        if: startsWith(github.base_ref, 'refonte/')
        run: |
          mkdir -p node_modules/@run-iq
          ln -s "$PWD/spec-refonte" node_modules/@run-iq/spec
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
